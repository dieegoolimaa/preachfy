# Render Blueprint. The API needs a paid plan: the free one sleeps.
services:
  - type: web
    name: preachfy-api
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm install && cd apps/api && npm run build
    startCommand: cd apps/api && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: REVENUECAT_SECRET_KEY
        sync: false
      - key: REVENUECAT_WEBHOOK_AUTH
        sync: false

  - type: web
    name: preachfy-web
    runtime: static
    buildCommand: npm install && cd apps/mobile && npm run export:web
    staticPublishPath: apps/mobile/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_URL
        sync: false
